name: Build GABON BUSINESS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accepter toutes les licences Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Vérifier le projet Android
        shell: bash
        run: |
          test -f android/settings.gradle
          test -f android/build.gradle
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          echo "Projet Android détecté correctement."

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Construire l'APK
        shell: bash
        run: |
          if [ -f android/gradlew ]; then
            cd android
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          elif [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew :android:app:assembleDebug --stacktrace
          else
            gradle -p android :app:assembleDebug --stacktrace
          fi

      - name: Rechercher l'APK
        shell: bash
        run: |
          APK="$(find android -type f -path '*/build/outputs/apk/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Aucun APK n'a été généré."
            exit 1
          fi

          echo "APK trouvé : $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: GABON-BUSINESS-AI-APK
          path: ${{ env.APK }}
          if-no-files-found: error
