name: Build GABON BUSINESS AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accepter les licences Android
        shell: bash
        run: |
          yes | sdkmanager --licenses || true

      - name: Extraire le projet Android
        shell: bash
        run: |
          set -e

          echo "Recherche du fichier ZIP du projet..."

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Aucun fichier ZIP du projet n'a été trouvé dans le dépôt."
            exit 1
          fi

          echo "ZIP trouvé : $ZIP_FILE"

          rm -rf /tmp/gabon-business-project
          mkdir -p /tmp/gabon-business-project

          unzip -q "$ZIP_FILE" -d /tmp/gabon-business-project

          echo "Recherche du projet Android..."

          SETTINGS_FILE="$(find /tmp/gabon-business-project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::settings.gradle ou settings.gradle.kts introuvable dans le ZIP."
            echo "Contenu extrait :"
            find /tmp/gabon-business-project -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Projet Android trouvé : $SETTINGS_FILE"

          ANDROID_DIR="$(dirname "$SETTINGS_FILE")"

          echo "Dossier Android : $ANDROID_DIR"

          rm -rf android
          cp -R "$ANDROID_DIR" android

          echo "Vérification des fichiers Android..."

          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/build.gradle || test -f android/build.gradle.kts
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml

          echo "Projet Android correctement extrait."

      - name: Activer AndroidX
        shell: bash
        run: |
          set -e

          touch android/gradle.properties

          if grep -q "^android.useAndroidX=" android/gradle.properties; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' android/gradle.properties
          else
            echo "android.useAndroidX=true" >> android/gradle.properties
          fi

          if grep -q "^android.enableJetifier=" android/gradle.properties; then
            sed -i 's/^android.enableJetifier=.*/android.enableJetifier=true/' android/gradle.properties
          else
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          echo "Configuration AndroidX :"
          cat android/gradle.properties

      - name: Vérifier la configuration Android
        shell: bash
        run: |
          set -e

          echo "=== settings.gradle ==="
          if [ -f android/settings.gradle ]; then
            cat android/settings.gradle
          else
            cat android/settings.gradle.kts
          fi

          echo "=== build.gradle ==="
          if [ -f android/build.gradle ]; then
            cat android/build.gradle
          else
            cat android/build.gradle.kts
          fi

          echo "=== app/build.gradle ==="
          if [ -f android/app/build.gradle ]; then
            cat android/app/build.gradle
          else
            cat android/app/build.gradle.kts
          fi

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Nettoyer le projet
        shell: bash
        run: |
          set -e

          echo "Nettoyage du projet Android..."

          gradle -p android clean --stacktrace

      - name: Construire l'APK
        shell: bash
        run: |
          set -e

          echo "Construction de GABON BUSINESS AI..."

          gradle -p android :app:assembleDebug --stacktrace

      - name: Rechercher l'APK
        shell: bash
        run: |
          set -e

          APK="$(find android -type f -path '*/build/outputs/apk/*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "::error::Aucun APK n'a été généré."
            exit 1
          fi

          echo "======================================"
          echo "APK GÉNÉRÉ AVEC SUCCÈS"
          echo "======================================"
          echo "APK : $APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: GABON-BUSINESS-AI-APK
          path: ${{ env.APK }}
          if-no-files-found: error
