name: Build GABON BUSINESS AI APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Android SDK
        uses: android-actions/setup-android@v3

      - name: Extraire le ZIP V3
        shell: bash
        run: |
          ZIP="GABON_BUSINESS_AI_FINAL_RELEASE_CANDIDATE_V3.zip"
          test -f "$ZIP"
          rm -rf build-src
          mkdir -p build-src
          unzip -q "$ZIP" -d build-src

          ANDROID_DIR="$(find build-src -type f -path '*/android/settings.gradle' -print -quit | xargs -r dirname)"
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projet Android trouvé dans : $ANDROID_DIR"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Construire l'APK
        shell: bash
        run: |
          cd "$ANDROID_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: GABON-BUSINESS-AI-V3-APK
          path: "${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
